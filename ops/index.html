<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ديوان الإدارة · DamaWorld</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a night majlis console - right-hand rail of grouped sections (RTL), a top bar with the live pulse, one working pane.
   On phones the rail becomes a scrolling strip. Gold = action, sadu red = ornament, green/amber/red = health. */
:root{
  --ink:#f5ecdb; --dim:#b3a58b; --mute:#7a6e5c;
  --bg:#0e0b08; --bg2:#15100b; --pane:#1a140e; --raise:#241c13; --line:#352a1d; --line2:#4a3a27;
  --gold:#e0b65c; --gold2:#f3d48f; --gold-ink:#2a1c08; --sadu:#a8402d;
  --good:#74c08a; --warn:#e8b04f; --bad:#e8664f; --blue:#7fb0e0; --violet:#b48ce6;
  --f-ui:"Tajawal", "Segoe UI", Tahoma, sans-serif; --f-num:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:14px; --shadow:0 1px 0 rgba(255,255,255,.03) inset, 0 10px 30px -18px rgba(0,0,0,.8);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0;color:var(--ink);font:15px/1.6 var(--f-ui)}
body{min-height:100vh;background:radial-gradient(1200px 600px at 85% -10%, rgba(224,182,92,.09), transparent 60%), radial-gradient(900px 500px at 0% 110%, rgba(168,64,45,.08), transparent 60%), var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
.num,.id{font-family:var(--f-num);font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.id{font-size:12px;color:var(--dim)}
a{color:var(--gold)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* sadu band: the one ornament */
.band{height:5px;background:repeating-linear-gradient(90deg,var(--sadu) 0 10px,var(--gold) 10px 14px,var(--bg) 14px 18px,var(--gold) 18px 22px)}

/* login */
#login{max-width:440px;margin:12vh auto 0;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
#login .card{background:linear-gradient(180deg,var(--pane),var(--bg2));border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
#login h1{font-size:30px;font-weight:800;margin:0 0 4px;color:var(--gold)}
#login p{color:var(--dim);margin:0 0 22px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;color:var(--dim)}
input,select,textarea{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px rgba(224,182,92,.12)}
.btn{background:var(--raise);border:1px solid var(--line2);border-radius:10px;padding:8px 16px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.gold{background:linear-gradient(180deg,var(--gold2),var(--gold));color:var(--gold-ink);border-color:var(--gold);font-weight:700}
.btn.bad{border-color:var(--bad);color:var(--bad)}
.btn.bad.solid{background:var(--bad);color:#1a0904}
.btn.sm{padding:5px 12px;font-size:13px;border-radius:8px}
.btn[disabled]{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.msg{margin-top:12px;font-size:14px;min-height:20px}
.msg.err{color:var(--bad)} .msg.ok{color:var(--good)}

/* app shell */
#app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
nav{background:linear-gradient(180deg,rgba(26,20,14,.96),rgba(14,11,8,.96));border-inline-start:1px solid var(--line);padding:18px 0 12px;position:sticky;top:0;height:100vh;overflow:auto}
nav .brand{display:flex;gap:12px;align-items:center;padding:0 18px 18px}
nav .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--gold-ink);background:linear-gradient(135deg,var(--gold2),var(--gold) 55%,#a47a2c)}
nav .brand b{display:block;font-weight:800;font-size:17px;color:var(--ink)}
nav .brand small{display:block;color:var(--mute);font-size:12px}
nav .grp{padding:14px 20px 6px;font-size:11px;letter-spacing:.06em;color:var(--mute)}
nav button{display:flex;gap:10px;align-items:center;width:calc(100% - 20px);margin-inline:10px;background:none;border:0;border-radius:10px;padding:9px 12px;text-align:right;cursor:pointer;color:var(--dim)}
nav button svg{width:18px;height:18px;flex:none;opacity:.8}
nav button span.t{flex:1}
nav button:hover{color:var(--ink);background:rgba(255,255,255,.03)}
nav button.on{color:var(--ink);background:linear-gradient(270deg,rgba(224,182,92,.16),rgba(224,182,92,.03));box-shadow:inset -3px 0 0 var(--gold)}
nav button.on svg{opacity:1;color:var(--gold)}
.pill{font-family:var(--f-num);font-size:11px;padding:1px 7px;border-radius:9px;background:var(--bad);color:#1a0904}
nav .who{padding:14px 20px 0;word-break:break-all;margin-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--mute)}
.shell{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:4;display:flex;align-items:center;gap:12px;padding:12px max(24px,env(safe-area-inset-left,0px)) 12px max(24px,env(safe-area-inset-right,0px));background:rgba(14,11,8,.82);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .crumb{font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.live{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim);background:var(--pane);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.live i{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 0 rgba(116,192,138,.6);animation:pulse 2s infinite}
.live b{font-family:var(--f-num);color:var(--ink);font-weight:500}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(116,192,138,0)}100%{box-shadow:0 0 0 0 rgba(116,192,138,0)}}
main{padding-block:22px 60px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px));min-width:0}
h2{font-size:26px;margin:0 0 4px;font-weight:800;text-wrap:balance}
.sub{color:var(--dim);margin:0 0 20px;font-size:14px}
h3{font-size:15px;margin:26px 0 10px;color:var(--gold);font-weight:700}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.hd .sub{margin:0}
.seg{display:inline-flex;background:var(--pane);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:none;border:0;border-radius:8px;padding:5px 12px;cursor:pointer;color:var(--dim);font-size:13px}
.seg button.on{background:var(--raise);color:var(--gold);box-shadow:0 0 0 1px var(--line2) inset}

/* KPI cards */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{position:relative;background:linear-gradient(180deg,var(--pane),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 12px;box-shadow:var(--shadow);overflow:hidden;min-width:0}
.kpi span{font-size:13px;color:var(--dim)}
.kpi b{display:block;font:500 28px/1.25 var(--f-num);direction:ltr;text-align:right;margin-top:2px}
.kpi em{font-style:normal;font-size:12px;color:var(--mute)}
.kpi .d{font-family:var(--f-num);font-size:12px;padding:1px 6px;border-radius:6px;direction:ltr;unicode-bidi:isolate;margin-inline-start:6px}
.kpi .d.up{color:var(--good);background:rgba(116,192,138,.1)} .kpi .d.dn{color:var(--bad);background:rgba(232,102,79,.1)}
.kpi svg.sp{position:absolute;inset:auto 0 0 0;width:100%;height:34px;opacity:.55;pointer-events:none}
.kpi.hero{border-color:rgba(224,182,92,.45);background:linear-gradient(160deg,rgba(224,182,92,.14),var(--pane) 55%)}

.panel{background:linear-gradient(180deg,var(--pane),var(--bg2));border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel>h3:first-child{margin-top:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:2fr 1fr;gap:14px}
.grid2>*,.grid3>*{min-width:0}
.cv{position:relative;height:280px} .cv.sm{height:220px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--pane)}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-weight:500;color:var(--dim);font-size:12px;text-align:right;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--bg2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tr.done td{opacity:.45}
tr.click{cursor:pointer} tr.click:hover td{background:var(--raise)}
td.heat{text-align:center;font-family:var(--f-num);border-radius:6px}
.tag{display:inline-block;font-size:12px;padding:1px 9px;border-radius:999px;border:1px solid var(--line2);color:var(--dim);white-space:nowrap}
.tag.bad{border-color:var(--bad);color:var(--bad)} .tag.warn{border-color:var(--warn);color:var(--warn)} .tag.good{border-color:var(--good);color:var(--good)} .tag.gold{border-color:var(--gold);color:var(--gold)}
.chart svg{width:100%;height:150px;display:block}
.empty{color:var(--mute);padding:22px;text-align:center}
.note{font-size:13px;color:var(--dim);background:rgba(224,182,92,.06);border:1px dashed var(--line2);border-radius:10px;padding:10px 12px;margin:0 0 14px}
.bar{height:8px;border-radius:6px;background:var(--raise);overflow:hidden} .bar i{display:block;height:100%;border-radius:6px}
.pcard{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap}
.pcard img{width:72px;height:72px;border-radius:12px;object-fit:cover;border:1px solid var(--line)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;flex:1;min-width:0}
.stats div{background:var(--raise);border-radius:10px;padding:7px 11px}
.stats small{display:block;color:var(--dim);font-size:12px}
.confirm{margin-top:10px;padding:12px;border:1px solid var(--bad);border-radius:10px;background:rgba(232,102,79,.08)}
.toast{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--raise);border:1px solid var(--gold);padding:10px 18px;border-radius:12px;z-index:9;max-width:90vw;box-shadow:var(--shadow)}
.toast.err{border-color:var(--bad)}
.loading{color:var(--dim);padding:20px}
.skel{height:120px;border-radius:var(--r);background:linear-gradient(90deg,var(--pane),var(--raise),var(--pane));background-size:200% 100%;animation:sk 1.2s infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (max-width:1100px){.grid3{grid-template-columns:1fr}}
@media (max-width:820px){
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr;align-content:start}
  nav{position:sticky;top:0;height:auto;display:flex;overflow-x:auto;padding:0;z-index:5;border:0;border-bottom:1px solid var(--line)}
  nav .brand,nav .who,nav .grp{display:none}
  nav button{width:auto;margin:0;white-space:nowrap;padding:12px 12px;gap:6px;border-radius:0}
  nav button svg{display:none}
  nav button.on{box-shadow:inset 0 -3px 0 var(--gold)}
  .top{position:static;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .grid2{grid-template-columns:1fr}
  .cv{height:230px}
}
@media (prefers-reduced-motion:reduce){.live i,.skel{animation:none}}
@media (prefers-reduced-motion:no-preference){.btn,nav button,.seg button{transition:color .15s,border-color .15s,background .15s}}

/* charts */
.chv{position:relative;display:flex;flex-direction:column}
.chv .plot{position:relative;flex:1;min-height:0}
.chv svg{display:block;width:100%;height:100%;overflow:visible}
.chv .ax{fill:var(--mute);font:11px var(--f-num)}
.chv .hit{cursor:crosshair}
.chv .bk{transition:opacity .12s}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin:-4px 0 8px}
.leg button{display:inline-flex;align-items:center;gap:6px;background:none;border:1px solid var(--line);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--dim);cursor:pointer}
.leg button i{width:8px;height:8px;border-radius:50%}
.leg button.off{opacity:.4;text-decoration:line-through}
.tip{position:absolute;z-index:3;pointer-events:none;min-width:150px;background:rgba(36,28,19,.96);border:1px solid var(--line2);border-radius:10px;padding:8px 10px;font-size:13px;box-shadow:0 12px 30px -10px rgba(0,0,0,.8)}
.tip b{display:block;margin-bottom:4px;color:var(--ink);font-family:var(--f-num);font-weight:500}
.tip div{display:flex;align-items:center;gap:7px;color:var(--dim)} .tip div span{flex:1} .tip i{width:8px;height:8px;border-radius:50%}
.tip em{font-style:normal;color:var(--ink)}
.donut{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.donut svg{flex:none} .donut .dv{fill:var(--ink);font:500 20px var(--f-num)} .donut .ax{fill:var(--mute);font:11px var(--f-ui)}
.donut ul{list-style:none;margin:0;padding:0;flex:1;min-width:120px;display:grid;gap:6px}
.donut li{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--dim)} .donut li span{flex:1} .donut li i{width:10px;height:10px;border-radius:3px} .donut li em{font-style:normal;color:var(--ink)}
.rank{display:grid;gap:10px}
.rr{display:grid;grid-template-columns:90px 1fr 46px;gap:10px;align-items:center;font-size:13px;color:var(--dim)}
.rr em{font-style:normal;color:var(--ink);text-align:left}
.cv.sm{height:auto;min-height:180px}
.chv svg{direction:ltr}
.kpis.k4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.kpis.k4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{padding-bottom:40px}
h3 small{font-weight:400;margin-inline-start:6px}
@media (max-width:820px){#onlx{display:none}.live{padding:4px 10px}}
/* player 360 */
.p360{margin-top:16px}
.phead{display:flex;gap:16px;align-items:center;margin-bottom:12px}
.pav{position:relative;flex:none}
.pav img,.pav .ph{width:84px;height:84px;border-radius:18px;object-fit:cover;border:1px solid var(--line2);display:grid;place-items:center;font-size:34px;font-weight:800;color:var(--gold);background:var(--raise)}
.pav .on{position:absolute;bottom:-3px;left:-3px;width:16px;height:16px;border-radius:50%;background:var(--good);border:3px solid var(--pane)}
.pinfo{min-width:0}
.stats.big{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.stats.big div{background:linear-gradient(180deg,var(--pane),var(--bg2));border:1px solid var(--line);padding:9px 12px}
.stats.big span{font-size:18px}
.stats em{display:block;font-style:normal;font-size:11px;color:var(--mute)}
.tl{list-style:none;margin:0;padding:0;display:grid;gap:12px;max-height:520px;overflow:auto}
.tl li{display:flex;gap:10px} .tl li>i{flex:none;width:10px;height:10px;border-radius:50%;margin-top:7px}
.tl p{margin:2px 0 0;font-size:14px;color:var(--ink)}
/* reports queue */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.qc b a{color:var(--ink);text-decoration:none} .qc b a:hover{color:var(--gold)}
.ql{list-style:none;margin:0 0 10px;padding:0;display:grid;gap:6px;font-size:14px}
.ql li{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.qcf:empty{display:none}
/* risk */
.risk{display:flex;align-items:center;gap:8px} .risk .bar{flex:1} .risk b{font-weight:500;min-width:26px}
/* chips */
.chips{gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--dim)}
.chip input{width:auto;margin:0;accent-color:var(--gold)}
.chip:has(input:checked){border-color:var(--gold);color:var(--gold);background:rgba(224,182,92,.08)}
/* events strip */
.gantt{position:relative;padding-top:26px;min-height:70px;overflow:hidden}
.gd{position:absolute;inset:0 0 auto 0;display:grid;grid-template-columns:repeat(21,1fr);direction:rtl}
.gd span{font:10px var(--f-num);color:var(--mute);text-align:center;border-inline-start:1px solid var(--line);height:200px;padding-top:4px}
.gd span.today{color:var(--gold)}
.gnow{position:absolute;top:0;bottom:0;width:2px;background:var(--bad);box-shadow:0 0 8px var(--bad)}
.gb{position:relative;height:26px;margin-top:6px;border:1px solid;border-radius:8px;display:flex;align-items:center;padding-inline:8px;font-size:12px;white-space:nowrap;overflow:hidden}
.gb span{overflow:hidden;text-overflow:ellipsis}
/* emergency stop */
.estop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-color:rgba(232,102,79,.45);background:linear-gradient(160deg,rgba(232,102,79,.10),var(--pane) 60%)}
.estop>div:first-child{flex:1;min-width:220px}
/* switches */
.swgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.sw{display:flex;gap:14px;align-items:center}
.sw>svg{width:26px;height:26px;flex:none;color:var(--gold)}
.sw.off>svg{color:var(--mute)} .sw.off{border-color:rgba(232,102,79,.45)}
.swt{flex:1;min-width:0} .swt b{display:block} .swt p{margin:2px 0 0;font-size:13px;color:var(--dim)}
.tog{flex:none;width:52px;height:30px;border-radius:999px;border:1px solid var(--line2);background:var(--raise);position:relative;cursor:pointer;padding:0}
.tog i{position:absolute;top:3px;right:3px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:right .18s,background .18s}
.tog.on{background:rgba(116,192,138,.25);border-color:var(--good)} .tog.on i{right:25px;background:var(--good)}
</style>
</head>
<body>
<div class="band"></div>

<section id="login"><div class="card">
  <h1>ديوان الإدارة</h1>
  <p>لوحة تحكم DamaWorld. الدخول لحسابات الإدارة فقط.</p>
  <form id="lf" autocomplete="on">
    <div class="field"><label for="u">اسم المستخدم</label><input id="u" name="username" autocomplete="username" dir="ltr" required minlength="3"></div>
    <div class="field"><label for="pw">كلمة السر</label><input id="pw" name="password" type="password" autocomplete="current-password" dir="ltr" required minlength="8"></div>
    <div class="row"><button class="btn gold" id="bin" type="submit">دخول</button><button class="btn" id="bup" type="button">سوّ حساب إدارة جديد</button></div>
    <div class="msg" id="lmsg"></div>
  </form>
</div></section>

<div id="app" hidden>
  <nav id="nav">
    <div class="brand"><span class="logo">د</span><div><b>ديوان الإدارة</b><small>DamaWorld · لوحة التحكم</small></div></div>
    <div class="grp">التحليلات</div>
    <button data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 13h8V3H3zM13 21h8v-8h-8zM13 3v6h8V3zM3 21h8v-4H3z"/></svg><span class="t">نظرة عامة</span></button>
    <button data-v="economy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="9" r="6"/><path d="M15.5 9.5a6 6 0 1 1-6 6"/></svg><span class="t">اقتصاد اللعبة</span></button>
    <button data-v="heat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 14.8V4a2 2 0 1 0-4 0v10.8a4 4 0 1 0 4 0z"/></svg><span class="t">الحرارة والأداء</span></button>

}

// ------------------------------------------------------------ charts: DAMA's own SVG charts (no outside library)
// line / area, grouped or stacked bars, a second axis, hover tooltip with a guide line, legend that hides a series,
// re-drawn when the box changes size. Donut + ranked bars for shares.
const CH = {};
const cssv = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const COL = () => ({ gold: cssv("--gold"), good: cssv("--good"), bad: cssv("--bad"), warn: cssv("--warn"), blue: cssv("--blue"), violet: cssv("--violet"), sadu: cssv("--sadu"), dim: cssv("--dim"), line: cssv("--line"), mute: cssv("--mute"), ink: cssv("--ink") });
function fade(hex, a) { if (!hex || hex[0] !== "#") return hex; const h = hex.replace("#", ""); const n = parseInt(h.length === 3 ? h.split("").map(x => x + x).join("") : h, 16); return "rgba(" + (n >> 16 & 255) + "," + (n >> 8 & 255) + "," + (n & 255) + "," + a + ")"; }
const lineSet = (name, data, color, fill) => ({ name, data, color, fill: !!fill });
const barSet = (name, data, color, stack) => ({ name, data, color, stack });
const RO = window.ResizeObserver ? new ResizeObserver(es => es.forEach(e => { const id = e.target.dataset.ch; if (id && CH[id]) drawChart(id); })) : null;
const nice = (v) => { if (v <= 0) return 1; const p = Math.pow(10, Math.floor(Math.log10(v))), f = v / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; };
const short = (v) => { const a = Math.abs(v); return a >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : a >= 1e4 ? Math.round(v / 1e3) + "K" : a >= 1e3 ? (v / 1e3).toFixed(1).replace(/\.0$/, "") + "K" : String(Math.round(v * 100) / 100); };

/** spec: { type: "line" | "bar", labels, series: [{name, data, color, fill?, stack?, axis?: "y2"}], stacked?, y2?: {min, max, fmt}, fmt?, money? } */
function chart(id, spec) {
  const box = document.getElementById(id); if (!box) return;
  box.dataset.ch = id; box.classList.add("chv");
  CH[id] = Object.assign({ off: new Set() }, CH[id] && CH[id].box === box ? { off: CH[id].off } : {}, { box, spec });
  if (RO) RO.observe(box);
  drawChart(id);
}
function drawChart(id) {
  const st = CH[id], box = st.box, sp = st.spec, c = COL();
  if (!box.isConnected) { delete CH[id]; return; }
  const W = Math.max(240, box.clientWidth), H = Math.max(160, box.clientHeight);
  const vis = sp.series.filter(s => !st.off.has(s.name)), L = sp.labels.length;
  const main = vis.filter(s => s.axis !== "y2"), sec = vis.filter(s => s.axis === "y2");
  // value range (stacked bars add up)
  let max = 0, min = 0;
  if (sp.type === "bar" && sp.stacked) { for (let i = 0; i < L; i++) { let pos = 0, neg = 0; main.forEach(s => { const v = +s.data[i] || 0; v >= 0 ? pos += v : neg += v; }); max = Math.max(max, pos); min = Math.min(min, neg); } }
  else main.forEach(s => s.data.forEach(v => { max = Math.max(max, +v || 0); min = Math.min(min, +v || 0); }));
  const step = nice((max - min) / 4 || 1); max = Math.ceil(max / step) * step || step; min = Math.floor(min / step) * step;
  const fmtY = sp.fmt || ((v) => (sp.money ? "$" : "") + short(v));
  // layout: y labels on the right (Arabic reading), room for the second axis on the left
  ctxMeasure.font = "11px 'IBM Plex Mono', monospace";
  const yW = Math.max(28, ...[max, min, (max + min) / 2].map(v => ctxMeasure.measureText(fmtY(v)).width + 10));
  const y2W = sec.length ? 62 : 6, top = 12, bot = 26, left = y2W, right = yW, pw = W - left - right, ph = H - top - bot;
  const X = (i) => left + (L <= 1 ? pw / 2 : sp.type === "bar" ? (i + .5) * pw / L : i * pw / (L - 1));
  const Y = (v) => top + ph * (1 - (v - min) / (max - min || 1));
  const y2 = sp.y2 || { min: 0, max: 1 }, Y2 = (v) => top + ph * (1 - (v - y2.min) / ((y2.max - y2.min) || 1));
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="' + esc(sp.title || "رسم بياني") + '">';
  // grid + y ticks
  for (let v = min; v <= max + 1e-9; v += step) { const y = Y(v); s += '<line x1="' + left + '" x2="' + (W - right) + '" y1="' + y + '" y2="' + y + '" stroke="' + c.line + '"' + (v === 0 ? "" : ' stroke-dasharray="2 4"') + "/>" + '<text x="' + (W - right + 6) + '" y="' + (y + 4) + '" class="ax">' + esc(fmtY(v)) + "</text>"; }

  // bars

    for (let i = 0; i < L; i++) {
      let pos = 0, neg = 0;

        const v = +se.data[i] || 0; if (!v) return;
        let y0, y1, x;
        if (sp.stacked) { x = X(i) - bw / 2; if (v >= 0) { y0 = Y(pos + v); y1 = Y(pos); pos += v; } else { y0 = Y(neg); y1 = Y(neg + v); neg += v; } }
        else { x = X(i) - groups * bw / 2 + k * bw + .5; y0 = Y(Math.max(0, v)); y1 = Y(Math.min(0, v)); }
        s += '<rect x="' + x.toFixed(1) + '" y="' + y0.toFixed(1) + '" width="' + Math.max(1, bw - 1).toFixed(1) + '" height="' + Math.max(1, y1 - y0).toFixed(1) + '" rx="' + Math.min(4, bw / 3) + '" fill="' + se.color + '" class="bk" data-i="' + i + '"/>';
      });
    }
  }
  // lines (+ area)
  vis.forEach(se => {
    if (sp.type === "bar" && se.axis !== "y2" && !se.line) return;
    const YY = se.axis === "y2" ? Y2 : Y, pts = se.data.map((v, i) => [X(i), YY(+v || 0)]);
    if (!pts.length) return;
    let d = "M" + pts[0][0].toFixed(1) + " " + pts[0][1].toFixed(1);
    for (let i = 1; i < pts.length; i++) { const [x0, y0] = pts[i - 1], [x1, y1] = pts[i], mx = (x0 + x1) / 2; d += " C" + mx.toFixed(1) + " " + y0.toFixed(1) + " " + mx.toFixed(1) + " " + y1.toFixed(1) + " " + x1.toFixed(1) + " " + y1.toFixed(1); }
    if (se.fill) { const gid = "g" + id + se.name.length + se.color.replace(/\W/g, ""); s += '<defs><linearGradient id="' + gid + '" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="' + se.color + '" stop-opacity=".32"/><stop offset="1" stop-color="' + se.color + '" stop-opacity="0"/></linearGradient></defs><path d="' + d + " L" + pts[pts.length - 1][0].toFixed(1) + " " + Y(Math.max(min, 0)) + " L" + pts[0][0].toFixed(1) + " " + Y(Math.max(min, 0)) + ' Z" fill="url(#' + gid + ')"/>'; }
    s += '<path d="' + d + '" fill="none" stroke="' + se.color + '" stroke-width="' + (se.fill ? 2.4 : 1.8) + '" stroke-linecap="round"' + (se.dash ? ' stroke-dasharray="5 4"' : "") + "/>";
    if (pts.length <= 40) { const p = pts[pts.length - 1]; s += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3.5" fill="' + se.color + '" stroke="#0e0b08" stroke-width="2"/>'; }
  });

  $("#nrm").onclick = async () => { await call("adm_cfg", { news: null }); toast("انشال الإعلان"); go("news"); };

  $("#prs").onclick = async () => { await call("adm_cfg", { pr: {} }); toast("رجعت الأسعار الأصلية"); go("store"); };

// ---- sales / cup / perf / audit
V.sales = async (m) => { const r = await call("adm_list", { what: "sales" }); const real = r.list.filter(x => x.env === "Production").reduce((a, x) => a + x.usd, 0);
  m.innerHTML = head("المبيعات", "آخر ٥٠٠ عملية · الحقيقي " + usd(real) + " قبل حصة Apple") + salesTable(r.list); bindPlayers(m); };
V.cup = async (m) => {
  const r = await call("adm_cup"), c = r.cup, ch = r.champion;
  const ph = !c ? "ما بدت" : c.phase === 0 ? "التسجيل" : c.phase === 1 ? "شغالة · الدور " + c.round : "خلصت";
  m.innerHTML = head("بطولة الجمعة", "كل جمعة ٩ بالليل بتوقيت الكويت، والتسجيل قبلها بنص ساعة") +
    '<div class="kpis">' + kpi("البطولة الجاية", kw(r.start), "") + kpi("الحالة", ph, r.off ? "ملغية هالأسبوع" : "") + kpi("المسجلين", c ? c.players.length : 0, "من 16") + kpi("البطل", esc(ch && ch.name || "-"), ch ? "لين " + kw(ch.until) : "") + "</div>" +
    '<div class="row" style="margin-top:16px"><button class="btn ' + (r.off ? "gold" : "bad") + '" id="co">' + (r.off ? "رجّع البطولة" : "ألغِ بطولة هالأسبوع") + "</button></div>" +
    (c && c.players.length ? "<h3>اللاعبين</h3>" + tbl(["الاسم", "رقم الحساب"], c.players.map(p => "<tr class='click' data-p='" + esc(p.gid) + "'><td>" + esc(p.name) + "</td><td class='id'>" + esc(p.gid) + "</td></tr>")) : "");
  bindPlayers(m);
  $("#co").onclick = async () => { await call("adm_cfg", { cupOff: !r.off }); toast(r.off ? "رجعت البطولة" : "انلغت بطولة هالأسبوع"); go("cup"); };
};
V.perf = async (m) => {
  OV = await call("adm_overview", { days: RANGE }); const l = OV.perf;
  const by = {}; l.forEach(x => { const o = by[x.model] || (by[x.model] = { model: x.model, n: 0, fps: 0, slow: 0, gpu: x.gpu, mem: x.mem }); o.n++; o.fps += x.fps; o.slow += x.slow; });
  const rows = Object.values(by).sort((a, b) => a.fps / a.n - b.fps / b.n).map(o => { const f = o.fps / o.n; return "<tr><td>" + esc(o.model) + "</td><td class='num'><span class='tag " + (f >= 50 ? "good" : f >= 28 ? "warn" : "bad") + "'>" + f.toFixed(1) + "</span></td><td class='num'>" + (o.slow / o.n).toFixed(1) + "%</td><td class='num'>" + o.n + "</td><td>" + esc(o.gpu) + "</td><td class='num'>" + fmt(o.mem) + " MB</td></tr>"; });
  m.innerHTML = head("أداء الأجهزة", "من أجهزة اللاعبين الحقيقية: ٣٠ ثانية بالساحة، مرة كل جلسة") + tbl(["الجهاز", "FPS", "إطارات بطيئة", "تقارير", "كرت الشاشة", "الذاكرة"], rows, "ما وصلت تقارير للحين (تجي من النسخة الجديدة)");
};
V.audit = async (m) => { const r = await call("adm_list", { what: "audit" });
  m.innerHTML = head("السجل", "كل شي انسوى من لوحة التحكم أو تلقائياً") + tbl(["الوقت", "مين", "العملية", "على", "التفاصيل"], r.list.map(x => "<tr><td class='num'>" + kw(x.t) + "</td><td>" + (x.by === "auto" ? '<span class="tag">تلقائي</span>' : x.by === me ? "أنت" : '<span class="id">' + esc(x.by) + "</span>") + "</td><td>" + esc(ACT[x.act] || x.act) + "</td><td>" + (x.target && x.target !== "all" ? "<a href='#' data-p='" + esc(x.target) + "'>" + '<span class="id">' + esc(x.target) + "</span></a>" : x.target === "all" ? "الكل" : "") + "</td><td>" + esc(x.info) + "</td></tr>"), "ما فيه شي للحين");
  m.querySelectorAll("a[data-p]").forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); go("players", a.dataset.p); }));
};


// ------------------------------------------------------------ players, reports, anti-cheat, mail for a group
const AGO = (t) => { if (!t) return "-"; const s = (Date.now() - Number(t)) / 1000; return s < 90 ? "الحين" : s < 3600 ? "قبل " + Math.round(s / 60) + " د" : s < 86400 ? "قبل " + Math.round(s / 3600) + " س" : "قبل " + Math.round(s / 86400) + " يوم"; };
const ONL = { world: "في الساحة", lobby: "في اللوبي", match: "يلعب مباراة" };
async function punish(id, kind, days, why, label) {
  await call("adm_punish", { id, kind, days, why: why || "" }); toast("تم: " + label);
}
function confirmBox(host, text, yes, onYes) {
  host.innerHTML = '<div class="confirm">' + esc(text) + '<div class="row" style="margin-top:8px"><button class="btn sm bad solid" data-y>' + esc(yes) + '</button><button class="btn sm" data-n>إلغاء</button></div></div>';
  host.querySelector("[data-n]").onclick = () => { host.innerHTML = ""; };
  host.querySelector("[data-y]").onclick = async () => { try { await onYes(); host.innerHTML = ""; } catch (e) { toast(e.message, true); } };
}

// ---- the player in full
async function showPlayer(id) {
  const box = $("#pv"); if (!box) return; box.innerHTML = '<div class="skel" style="margin-top:16px"></div>';
  const r = await call("adm_player", { id }), p = r.p, pen = p.pen || {}, now = Date.now();
  const banned = pen.ban > now, muted = pen.mute > now, rk = p.rk || {}, games = (rk.wins || 0) + (rk.losses || 0);
  const photo = r.av && r.av.p ? '<img alt="" src="data:image/jpeg;base64,' + esc(r.av.p) + '">' : '<div class="ph">' + esc((p.name || "؟").slice(0, 1)) + "</div>";
  const st = (l, v, sub) => "<div><small>" + l + "</small><span class='num'>" + v + "</span>" + (sub ? "<em>" + esc(sub) + "</em>" : "") + "</div>";
  // heat / phones of this player
  const hs = {}; (r.heat || []).forEach(x => { const o = hs[x.sid] || (hs[x.sid] = { model: x.model, ver: x.ver, t: x.t, up: 0, max: -1, fps: 0, n: 0 }); o.up = Math.max(o.up, x.up); o.max = Math.max(o.max, x.th); o.fps += x.fps; o.n++; o.t = Math.max(o.t, x.t); });
  const sess = Object.values(hs).sort((a, b) => b.t - a.t), thc = THC();
  // one timeline: purchases, penalties, reports, team actions
  const tl = [];
  (p.tx || []).forEach(x => tl.push({ t: x.t, k: "buy", txt: "اشترى " + (PIDS[x.p] || x.p) + (x.e === "Production" ? "" : " (تجريبي)") }));
  (pen.h || []).forEach(h => tl.push({ t: h.t, k: "pen", txt: (ACT[h.k] || h.k) + (h.d ? " " + h.d + " يوم" : h.k === "ban" || h.k === "mute" ? " دائم" : "") + (h.why ? " · " + h.why : "") + (h.by === "auto" ? " · تلقائي" : "") }));
  (r.about || []).forEach(x => tl.push({ t: x.t, k: "rep", txt: "بلاغ (" + (WHERE[x.where] || x.where) + "): " + x.text }));
  (r.acts || []).forEach(x => tl.push({ t: x.t, k: "act", txt: (ACT[x.act] || x.act) + (x.info ? " · " + x.info : "") }));
  tl.sort((a, b) => b.t - a.t);
  const TLC = { buy: "var(--good)", pen: "var(--bad)", rep: "var(--warn)", act: "var(--gold)" }, TLN = { buy: "شراء", pen: "عقوبة", rep: "بلاغ", act: "الإدارة" };
  box.innerHTML = '<div class="p360">' +
    '<div class="panel phead"><div class="pav">' + photo + (r.online ? '<i class="on" title="' + esc(ONL[r.online] || "متصل") + '"></i>' : "") + "</div>" +
    '<div class="pinfo"><h3 style="margin:0">' + esc(p.name) + (r.flagC ? ' <span class="tag">' + esc(FLAG[r.flagC] || r.flagC) + "</span>" : "") + "</h3>" +
    '<div class="row" style="gap:8px;margin-top:6px">' + (r.uid ? '<span class="tag gold num">ID ' + r.uid + "</span>" : "") +
    (r.online ? '<span class="tag good">● ' + esc(ONL[r.online] || "متصل") + "</span>" : '<span class="tag">آخر دخول ' + AGO(p.seen) + "</span>") +
    (banned ? '<span class="tag bad">محظور ' + (pen.ban > 9e14 ? "دائم" : "لين " + kw(pen.ban)) + "</span>" : "") + (muted ? '<span class="tag warn">مكتوم ' + (pen.mute > 9e14 ? "دائم" : "لين " + kw(pen.mute)) + "</span>" : "") +
    (p.fd ? '<span class="tag gold">مؤسس</span>' : "") + (p.gold ? '<span class="tag gold">الموسم الذهبي</span>' : "") + (r.flags.length ? '<span class="tag bad">مشبوه</span>' : "") + '<span class="id">' + esc(id) + "</span></div></div></div>" +
    '<div class="stats big">' + st("الجواهر", fmt(p.gems)) + st("الكوينز", fmt(p.coins)) + st("المستوى", p.level) + st("النقاط", fmt(p.rank)) +
    st("الفوز", games ? Math.round(100 * (rk.wins || 0) / games) + "%" : "-", (rk.wins || 0) + " فوز من " + games) + st("مباريات اليوم", p.today.matches, p.today.wins + " فوز") + st("صرف حقيقي", usd(p.usd), (p.tx || []).length + " عملية") +
    st("النسخة", esc(p.ver || "-")) + st("سجّل", kw(p.created).split(" ")[0], AGO(p.created)) + st("الأصدقاء", (r.friends || []).length) + st("بلاغات عليه", r.about.length, "بلّغ هو " + r.by) + st("بريد استلمه", r.mailGot || 0) + "</div>" +
    '<div class="grid2" style="margin-top:14px"><div>' +
    '<div class="panel"><h3>العقوبات</h3><div class="field"><label for="why">السبب (يشوفه اللاعب)</label><input id="why" placeholder="مثال: سب في الشات"></div>' +
    '<div class="row"><select id="days" style="width:auto"><option value="1">يوم</option><option value="3">٣ أيام</option><option value="7" selected>٧ أيام</option><option value="30">٣٠ يوم</option><option value="0">دائم</option></select>' +
    '<button class="btn sm" data-k="warn">تحذير</button><button class="btn sm" data-k="mute">كتم</button><button class="btn sm bad" data-k="ban">حظر</button>' +
    (muted ? '<button class="btn sm" data-k="unmute">فك الكتم</button>' : "") + (banned ? '<button class="btn sm" data-k="unban">فك الحظر</button>' : "") + '</div><div id="cf"></div></div>' +
    '<div class="panel" style="margin-top:14px"><h3>هدية أو تعديل رصيد</h3><div class="row"><input id="gg" type="number" placeholder="جواهر" style="width:110px"><input id="gc" type="number" placeholder="كوينز" style="width:120px"><input id="gn" type="number" placeholder="بطاقات اسم" style="width:110px"></div>' +
    '<div class="field" style="margin-top:10px"><input id="gt" placeholder="عنوان الرسالة (مثال: تعويض)"></div><div class="row"><button class="btn gold sm" id="gmail">أرسل بالبريد</button><button class="btn sm" id="gdir">عدّل الرصيد مباشرة</button></div>' +
    '<p class="sub" style="margin:8px 0 0">بالبريد: اللاعب يستلمها بنفسه. مباشرة: تنضاف أو تنقص على طول (للتصحيح).</p></div>' +
    '<div class="panel" style="margin-top:14px"><h3>الأجهزة والجلسات</h3>' + (sess.length ? tbl(["آخر جلسة", "الجهاز", "النسخة", "المدة", "FPS", "أعلى حرارة"], sess.slice(0, 8).map(s => "<tr><td class='num'>" + kw(s.t) + "</td><td>" + esc(s.model) + "</td><td class='num'>" + esc(s.ver) + "</td><td class='num'>" + Math.round(s.up / 60) + " د</td><td class='num'>" + (s.fps / s.n).toFixed(0) + "</td><td>" + (s.max >= 0 ? "<span class='tag' style='border-color:" + thc[s.max] + ";color:" + thc[s.max] + "'>" + TH[s.max] + "</span>" : "-") + "</td></tr>")) : '<div class="empty">ما فيه جلسات مسجلة (تبدأ من نسخة فيها مسجّل الحرارة)</div>') + "</div>" +
    '</div><div><div class="panel"><h3>السجل الكامل</h3>' + (tl.length ? '<ol class="tl">' + tl.slice(0, 40).map(x => '<li><i style="background:' + TLC[x.k] + '"></i><div><span class="tag" style="border-color:' + TLC[x.k] + ";color:" + TLC[x.k] + '">' + TLN[x.k] + '</span> <span class="id">' + kw(x.t) + "</span><p>" + esc(x.txt) + "</p></div></li>").join("") + "</ol>" : '<div class="empty">ما فيه شي للحين</div>') + "</div>" +
    ((r.friends || []).length ? '<div class="panel" style="margin-top:14px"><h3>الأصدقاء</h3><div class="row">' + r.friends.map(f => '<a href="#" class="tag" data-p="' + esc(f.id) + '">' + esc(f.n || f.id.slice(0, 6)) + "</a>").join("") + "</div></div>" : "") +
    (r.flags.length ? '<div class="panel" style="margin-top:14px"><h3>ليش مشبوه</h3>' + tbl(["اليوم", "السبب", "كم مرة"], r.flags.map(f => "<tr><td class='num'>" + dayLbl(f.day) + "</td><td>" + esc(f.why) + "</td><td class='num'>" + f.n + "</td></tr>")) + "</div>" : "") +
    "</div></div></div>";
  box.querySelectorAll("a[data-p]").forEach(a => a.addEventListener("click", (e) => { e.preventDefault(); go("players", a.dataset.p); }));
  box.querySelectorAll("[data-k]").forEach(b => b.addEventListener("click", () => {
    const kind = b.dataset.k, days = Number($("#days").value), why = $("#why").value.trim();
    const label = ACT[kind] + (kind === "ban" || kind === "mute" ? " " + (days ? days + " يوم" : "دائم") : "");
    confirmBox($("#cf"), label + " على " + p.name + "؟", "نعم، نفّذ", async () => { await punish(id, kind, days, why, label); showPlayer(id); });
  }));
  const gift = async (direct) => {
    const a = { id, gems: Number($("#gg").value || 0), coins: Number($("#gc").value || 0), nc: Number($("#gn").value || 0), title: $("#gt").value.trim(), direct };

const EVC = () => { const c = COL(); return { coins: c.gold, xp: c.blue, sale: c.good }; };
const dtl = (t) => { const d = new Date(Number(t)); const p = (x) => String(x).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()); };

  await overview();

    '<div class="row"><div class="field" style="flex:1"><label for="ek">النوع</label><select id="ek"><option value="coins">كوينز المباريات ×</option><option value="xp">خبرة المباريات ×</option><option value="sale">خصم المتجر %</option></select></div><div class="field" style="flex:1"><label for="ev" id="evl">المضاعف</label><input id="ev" type="number" step="0.5" min="1" max="5" value="2"></div></div>' +

    '<div class="field"><label for="mvt">الرسالة</label><input id="mvt" value="' + esc(u.text || "") + '" placeholder="فيه تحديث جديد للعبة، حدّث عشان تكمل"></div><div class="field"><label for="mvu">رابط التحديث</label><input id="mvu" dir="ltr" value="' + esc(u.url || "") + '" placeholder="https://apps.apple.com/app/…"></div>' +

    '<div><h3 style="margin-top:0">الصيانة</h3><div class="panel"><div class="row" style="margin-bottom:10px"><span class="tag ' + (mt.on ? "bad" : "good") + '">' + (mt.on ? "الصيانة شغالة" + (mt.co && mt.co.length ? " · " + mt.co.map(x => FLAG[x]).join("، ") : " · الكل") : "اللعبة شغالة") + "</span></div>" +
    '<div class="field"><label for="mtx">رسالة الصيانة</label><input id="mtx" maxlength="300" value="' + esc(mt.text || "") + '" placeholder="نحدّث السيرفر، نرجع بعد ساعة"></div><div class="field"><label for="mth">ترجع بعد (ساعات، اختياري)</label><input id="mth" type="number" min="0"></div>' +
    '<div class="field"><label>الدول (فاضي = كل الدول)</label><div class="row chips">' + CO.map(x => '<label class="chip"><input type="checkbox" value="' + x + '"' + (mt.co && mt.co.includes(x) ? " checked" : "") + ">" + FLAG[x] + "</label>").join("") + "</div></div>" +
    '<div class="field"><label for="mta">حسابات تقدر تدخل وقت الصيانة (رقم كل حساب بسطر)</label><textarea id="mta" dir="ltr" style="min-height:60px">' + esc((mt.allow || []).join("\n")) + "</textarea></div>" +
    '<div class="row"><button class="btn ' + (mt.on ? "gold" : "bad solid") + '" id="mtg">' + (mt.on ? "أوقف الصيانة" : "شغّل الصيانة") + '</button></div><div id="mcf"></div></div></div></div>';
  const allowMe = () => { const l = $("#mta").value.split(/\s+/).filter(Boolean); if (me && !l.includes(me)) l.push(me); return l; };
  const maint = (on, text, co) => call("adm_cfg", { maint: { on, text, until: 0, allow: allowMe(), co: co || [] } });
  if ($("#eon")) $("#eon").onclick = () => confirmBox($("#ecf"), "توقف اللعبة عن كل اللاعبين الحين؟", "نعم، أوقفها", async () => { await maint(true, "صيانة طارئة، نرجع بأسرع وقت"); toast("انوقفت اللعبة"); go("news"); });
  if ($("#eoff")) $("#eoff").onclick = async () => { await maint(false, mt.text || ""); toast("رجعت اللعبة تشتغل"); go("news"); };
  $("#nsv").onclick = async () => { const h = +$("#nh").value; try { await call("adm_cfg", { news: { title: $("#nt").value.trim(), text: $("#nx").value.trim(), until: h ? Date.now() + h * 3600000 : 0 } }); toast("انشر الإعلان"); go("news"); } catch (e) { toast(e.message, true); } };
  $("#nrm").onclick = async () => { await call("adm_cfg", { news: null }); toast("انشال الإعلان"); go("news"); };
  $("#mtg").onclick = () => {
    const on = !mt.on, h = +$("#mth").value, co = [...m.querySelectorAll(".chips input:checked")].map(i => i.value);
    const a = { maint: { on, text: $("#mtx").value.trim(), until: h ? Date.now() + h * 3600000 : 0, allow: allowMe(), co } };
    if (!on) return call("adm_cfg", a).then(() => { toast("رجعت اللعبة تشتغل"); go("news"); });
    confirmBox($("#mcf"), "تشغيل الصيانة يوقف اللعبة عن " + (co.length ? "لاعبين " + co.map(x => FLAG[x]).join("، ") : "كل اللاعبين") + ". أكيد؟", "نعم، شغّلها", async () => { await call("adm_cfg", a); toast("الصيانة شغالة"); go("news"); });
  };
  $("#mvs").onclick = () => {
    const v = $("#mv").value.trim(), old = vk.filter(x => v && verCmp(x, v) < 0).reduce((s, x) => s + vers[x], 0);
    const go2 = async () => { await call("adm_cfg", { minVer: v, updText: $("#mvt").value.trim(), updUrl: $("#mvu").value.trim() }); toast("انحفظ"); go("news"); };
    if (old) confirmBox($("#vcf"), "تقريباً " + old + " دخول من نسخ أقدم من " + v + " آخر ٣ أيام: بيطلب منهم يحدّثون. أكيد؟", "نعم", go2); else go2().catch(e => toast(e.message, true));
  };
};
function verCmp(a, b) { const x = String(a).split(".").map(Number), y = String(b).split(".").map(Number); for (let i = 0; i < Math.max(x.length, y.length); i++) { const d = (x[i] || 0) - (y[i] || 0); if (d) return d; } return 0; }

// ------------------------------------------------------------ switches: turn a feature off for everyone, without an update (from 0.4.0)
const SW = [
  ["voice", "المايك والصوت", "صوت الساحة وصوت المباريات. إذا انطفى: المايك يتسكّر عند الكل وأزرار الصوت تختفي", "M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zM5 11a7 7 0 0 0 14 0M12 18v4"],
  ["chat", "الدردشة الكتابية", "دردشة الساحة واللوبي. إذا انطفت: الشريط يختفي وما أحد يقدر يكتب", "M4 4h16v12H8l-4 4z"],
  ["photos", "رفع الصور", "صور الملف الشخصي من الجوال. إذا انطفى: اللاعب يختار من صور اللعبة بس", "M3 5h18v14H3zM8 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM21 16l-5-5-9 8"],
  ["friends", "طلبات الصداقة", "إرسال طلبات جديدة. الأصدقاء الحاليين يبقون", "M9 8a4 4 0 1 0 0-.01M2 21a7 7 0 0 1 14 0M19 8v6M16 11h6"],
  ["store", "الشراء بالفلوس", "يقفل زر الشراء في خزنة الجواهر (المشتريات اللي تمت تكمل عادي)", "M3 9 5 3h14l2 6M3 9h18v11H3z"],
  ["cup", "بطولة الجمعة", "التسجيل في البطولة", "M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"],
  ["rate", "نافذة تقييم اللعبة", "نافذة أبل للتقييم بعد الفوز", "M12 2l3 7h7l-5.5 4.5L18 21l-6-4-6 4 1.5-7.5L2 9h7z"],
];
V.switches = async (m) => {
  await overview();
  const ff = Object.assign({}, OV.cfg.ff || {}), rate = OV.cfg.rate || { on: true, days: 3 };
  const off = SW.filter(s => ff[s[0]] === false).length;
  m.innerHTML = head("المفاتيح", "شغّل أو طفّي أي ميزة عند كل اللاعبين خلال دقيقة، بدون تحديث. مفيدة لو صار خلل أو إزعاج في ميزة معيّنة (تشتغل من نسخة 0.4.0)") +
    '<div class="kpis" style="margin-bottom:14px">' + kpi("شغالة", String(SW.length - off), "من " + SW.length + " ميزات") + kpi("مطفية", String(off), off ? SW.filter(s => ff[s[0]] === false).map(s => s[1]).join("، ") : "كل شي شغال", { hero: off > 0 }) + "</div>" +
    '<div class="swgrid">' + SW.map(s => { const on = ff[s[0]] !== false; return '<div class="panel sw' + (on ? "" : " off") + '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + s[3] + '"/></svg><div class="swt"><b>' + esc(s[1]) + "</b><p>" + esc(s[2]) + '</p></div><button class="tog' + (on ? " on" : "") + '" data-s="' + s[0] + '" role="switch" aria-checked="' + on + '" aria-label="' + esc(s[1]) + '"><i></i></button></div>'; }).join("") + "</div>" +
    '<h3>نافذة التقييم</h3><div class="panel"><p class="sub" style="margin:0 0 12px">تطلع نافذة أبل الرسمية (نجوم) بعد ما يفوز اللاعب، إذا لعب عدد أيام معيّن وفاز مرتين على الأقل. أبل تحددها ٣ مرات بالسنة، واحنا مرة كل ٤ شهور. ممنوع نعطي جوائز مقابل التقييم.</p>' +
    '<div class="row"><div class="field" style="width:220px;margin:0"><label for="rd">بعد كم يوم لعب</label><input id="rd" type="number" min="1" max="60" value="' + (rate.days || 3) + '"></div><button class="btn gold" id="rsv" style="align-self:flex-end">احفظ</button></div></div><div id="scf"></div>';
  m.querySelectorAll(".tog").forEach(b => b.onclick = () => {
    const k = b.dataset.s, on = !b.classList.contains("on"), name = SW.find(s => s[0] === k)[1];
    const apply = async () => { const next = Object.assign({}, ff); if (on) delete next[k]; else next[k] = false; await call("adm_cfg", { ff: next }); toast((on ? "اشتغلت: " : "انطفت: ") + name); go("switches"); };
    if (on) apply().catch(e => toast(e.message, true)); else confirmBox($("#scf"), "تطفي «" + name + "» عند كل اللاعبين؟", "نعم، طفّها", apply);
  });
  $("#rsv").onclick = async () => { await call("adm_cfg", { rate: { on: ff.rate !== false, days: +$("#rd").value || 3 } }); toast("انحفظ"); };
};

// back with a live session
(async () => { if (load("st")) { $("#lmsg").textContent = "جاري الدخول…"; try { await refresh(); await enter(); } catch (e) { $("#lmsg").textContent = ""; store("st", null); } } })();
</script>
